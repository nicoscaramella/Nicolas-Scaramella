[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-planta"
version = "0.1.0"
description = "Sistema de parte por voz y detección en planta para PIA-3 (Academia Novit 2026)"
requires-python = ">=3.11"
dependencies = [
  "planta_contrato @ git+https://github.com/NovitSoftware/academia2026-tp#subdirectory=contrato",
  "pydantic>=2.7",
  "paho-mqtt>=2.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "faster-whisper>=1.0",
  "sentence-transformers>=3.0",
  "langchain-core>=0.3",
  "mcp>=1.0,<2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["sistema", "sistema.rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
